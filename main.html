<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <table border="1" style="width: 100%; text-align: center; border-collapse: collapse;">
  <tr>
    <!-- Top Left -->
    <td style="padding: 20px; width: 50%;">
      <table border="1" style="width: 100%; border-collapse: collapse;">
        <tr>
          <th colspan="2">Nested Table 2</th>
        </tr>
        <tr>
          <th>Column 1</th>
          <th>Column 2</th>
        </tr>
        <tr>
          <td>abc</td>
          <td>def</td>
        </tr>
      </table>
    </td>
    
    <!-- Top Right -->
    <td style="padding: 20px; width: 50%;">
      <table border="1" style="width: 100%; border-collapse: collapse;">
        <tr>
          <th>Nested Table 1</th>
        </tr>
        <tr>
          <td>
            <ul style="text-align: left; display: inline-block; margin: 0;">
              <li>List item 1</li>
              <li>List item 2</li>
              <li>List item 3</li>
            </ul>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  
  <tr>
    <!-- Bottom Left -->
    <td style="padding: 20px;">
      <table border="1" style="width: 100%; border-collapse: collapse;">
        <tr>
          <th colspan="2">Nested Table 3</th>
        </tr>
        <tr>
          <td><a href="#">Nested Table</a></td>
          <td>Demo Continued</td>
        </tr>
      </table>
    </td>
    
    <!-- Bottom Right -->
    <td style="padding: 20px;">
      <table border="1" style="width: 100%; border-collapse: collapse;">
        <tr>
          <th>Nested Table 4</th>
        </tr>
        <tr>
          <td style="background-color: black; color: white;">HTML</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
  </body>
</html>
